name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Package validation
        run: |
          bun run publint
          bun run attw

      - name: Checkout html5lib-tests
        uses: actions/checkout@v5
        with:
          repository: html5lib/html5lib-tests
          path: html5lib-tests

      - name: html5lib-tests conformance
        run: bun run test:html5lib
